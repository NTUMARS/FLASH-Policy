# FLASH: Polynomial-to-Polynomial Flow Matching Policy
# Extends FLASH-G with A2A-style informative flow start: history polynomial → target polynomial
_target_: roboverse_learn.il.policies.flash.flash_policy.FlashDiTImagePolicy

# Data Shape
shape_meta: ${shape_meta}

# ========== Visual encoder configuration ==========
obs_encoder:  
  _target_: roboverse_learn.il.utils.vision.multi_image_obs_encoder.MultiImageObsEncoder
  shape_meta: ${shape_meta}
  rgb_model:
    _target_: roboverse_learn.il.utils.vision.model_getter.get_resnet
    name: resnet18
    weights: null
  resize_shape: null
  crop_shape: null
  random_crop: True
  use_group_norm: True
  share_rgb_model: False
  imagenet_norm: True

# ========== Trajectory parameters ==========
horizon: ${horizon}
n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
n_obs_steps: ${n_obs_steps}
obs_as_global_cond: ${obs_as_global_cond} 

num_inference_steps: 1

# ========== DiT architecture parameters ==========
diffusion_step_embed_dim: 256
hidden_dim: 512
num_layers: 4
num_heads: 8
mlp_ratio: 4
dropout: 0.0

# ========== FLASH-G parameters (inherited) ==========
poly_order: 6
basis_type: "legendre"

fit_pad: 1
boundary_constraint: true

# ========== FLASH-specific parameters ==========
history_noise_std: 0.5          # The standard deviation of Gaussian noise added to the historical polynomial coefficients during training
history_reg_lambda: 0.1       # The regularization strength of Tikhonov in historical polynomial fitting
consistency_weight: 1.0        

flash_solver: "euler"


poly_prefix: 1                  # The number of extra timesteps to cover BEFORE the action points
                                # null: The polynomials output by the model cover the entire horizon (H_poly= horizon)
                                # 0: Only cover the action points (H_poly = n_action_steps)
                                # n: Cover the action points and n extra history points (H_poly = n_action_steps + n)

poly_suffix: 1                  # The number of extra timesteps to cover AFTER the action points (only effective when poly_prefix is not "null")
                                # 0: No extra coverage (BC overlap falls at fit_pad edge, less continuous)
                                # n: Cover n extra discarded point (ensures BC overlap within core, C1 continuous)
