# ACT (CVAE chunk policy) for the Push2D/shared pipeline.
_target_: roboverse_learn.il.policies.act.act_image_policy.ACTImagePolicy

shape_meta: ${shape_meta}

horizon: ${horizon}
n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
n_obs_steps: ${n_obs_steps}

chunk_size: 8
kl_weight: 10
hidden_dim: 256
dim_feedforward: 1024
enc_layers: 2
dec_layers: 4
nheads: 4
dropout: 0.1
backbone: resnet18
position_embedding: sine
camera_names: [head_cam]
